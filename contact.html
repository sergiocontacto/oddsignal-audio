<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - OddSignal Audio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="apple-touch-icon" href="./favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon_io/favicon-16x16.png">
    <link rel="manifest" href="./favicon_io/site.webmanifest">
    <style>
        .contact-section {
            padding: 80px 0;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: start;
        }

        .contact-info h3 {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .contact-item {
            margin-bottom: 40px;
        }

        .contact-item h4 {
            color: var(--color-accent);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .contact-item p {
            font-size: 16px;
            line-height: 1.7;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-text-secondary);
        }

        .form-group input,
        .form-group textarea {
            padding: 12px 16px;
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: 4px;
            color: var(--color-text);
            font-family: var(--font-primary);
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 10px rgba(196, 50, 22, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-submit {
            align-self: flex-start;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .contact-section {
                padding: 40px 0;
            }

            .contact-info h3 {
                margin-bottom: 30px;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="./LOGO-BLANCO-TRANSPARENTE.png" alt="OddSignal Audio">
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">HOME</a></li>
                <li><a href="products.html" class="nav-link">PRODUCTS</a></li>
                <li><a href="about.html" class="nav-link">ABOUT</a></li>
                <li><a href="contact.html" class="nav-link active">CONTACT</a></li>
                <li class="language-selector">
                    <select id="language-selector">
                        <option value="en">EN</option>
                        <option value="es">ES</option>
                        <option value="fr">FR</option>
                        <option value="de">DE</option>
                        <option value="it">IT</option>
                    </select>
                </li>
            </ul>
        </div>
    </nav>


    <!-- Contact Content -->
    <section style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 72px - 140px);">
        <div class="container" style="max-width: 600px;">
            <div style="background: rgba(17, 24, 35, 0.5); padding: 40px; border: 1px solid var(--color-border); border-radius: 4px;">
                <div style="margin-bottom: 32px;">
                    <h4 style="color: var(--color-accent); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;">Email</h4>
                    <p style="font-size: 18px;"><a href="mailto:oddsignalaudio@gmail.com" style="color: var(--color-accent); text-decoration: none; transition: color 0.2s ease;">oddsignalaudio@gmail.com</a></p>
                </div>

                <div style="margin-bottom: 32px; padding-top: 32px; border-top: 1px solid var(--color-border);">
                    <h4 style="color: var(--color-accent); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;">Response Time</h4>
                    <p style="font-size: 16px; color: var(--color-text-secondary); line-height: 1.7;">We typically respond to inquiries within 24-48 hours during business days.</p>
                </div>

                <div style="padding-top: 32px; border-top: 1px solid var(--color-border);">
                    <h4 style="color: var(--color-accent); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;">Follow Us</h4>
                    <p style="font-size: 16px; color: var(--color-text-secondary);">Stay updated with the latest news and announcements.</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 OddSignal Audio. All rights reserved.</p>
            <div class="footer-links">
                <a href="contact.html">Contact</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </footer>

    <script src="i18n.js"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Thank you for your message. We will get back to you soon!');
            this.reset();
        });
    </script>
</body>
</html>

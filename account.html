<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - OddSignal Audio</title>
    <link rel="stylesheet" href="styles.css?v=5">
    <link rel="apple-touch-icon" href="./favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon_io/favicon-16x16.png">
    <link rel="manifest" href="./favicon_io/site.webmanifest">
</head>
<body class="dark-theme">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="./LOGO-BLANCO-TRANSPARENTE.png" alt="OddSignal Audio">
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">HOME</a></li>
                <li><a href="products.html" class="nav-link">PRODUCTS</a></li>
                <li><a href="about.html" class="nav-link">ABOUT</a></li>
                <li><a href="contact.html" class="nav-link">CONTACT</a></li>
                <li><a href="account.html" class="nav-link active" data-auth-link>Account</a></li>
                <li class="language-selector">
                    <select id="language-selector">
                        <option value="en">EN</option>
                        <option value="es">ES</option>
                        <option value="fr">FR</option>
                        <option value="de">DE</option>
                        <option value="it">IT</option>
                    </select>
                </li>
            </ul>
        </div>
    </nav>

    <section class="account-section" data-auth-view>
        <div class="container" style="max-width: 820px;">

            <header class="account-header">
                <div>
                    <h2>My account</h2>
                    <p class="account-email" id="account-email">&nbsp;</p>
                </div>
                <button type="button" class="btn btn-secondary" id="sign-out">Sign out</button>
            </header>

            <p class="auth-message" id="account-message" hidden></p>

            <!-- Estado de beta tester -->
            <div class="account-block" id="beta-block" hidden>
                <h3>Early access</h3>
                <p id="beta-status"></p>
            </div>

            <!-- Descargas -->
            <div class="account-block">
                <h3>Downloads</h3>
                <div id="downloads">
                    <p class="account-empty">Loading...</p>
                </div>
            </div>

        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 OddSignal Audio. All rights reserved.</p>
            <div class="footer-links">
                <a href="contact.html">Contact</a>
                <a href="about.html">About</a>
                <a href="https://www.instagram.com/oddsignalaudio" target="_blank" rel="noopener">Instagram</a>
            </div>
        </div>
    </footer>

    <script src="supabase-config.js?v=5"></script>
    <script src="i18n.js?v=5"></script>
    <script type="module">
        import {
            requireConfig, requireAuth, getProfile,
            getReleases, getDownloadUrl, signOut
        } from './auth.js';

        const message = document.getElementById('account-message');

        function show(text, kind = 'error') {
            message.textContent = text;
            message.className = 'auth-message auth-message--' + kind;
            message.hidden = false;
        }

        document.getElementById('sign-out').addEventListener('click', signOut);

        if (requireConfig()) {
            init();
        }

        async function init() {
            const session = await requireAuth();
            if (!session) return;

            document.getElementById('account-email').textContent = session.user.email;

            let profile = null;
            try {
                profile = await getProfile();
            } catch (err) {
                show('Could not load your profile: ' + err.message);
            }

            renderBeta(profile);
            await renderDownloads(profile);
        }

        function renderBeta(profile) {
            const block = document.getElementById('beta-block');
            const status = document.getElementById('beta-status');
            if (!profile) return;

            block.hidden = false;
            if (profile.is_beta_tester) {
                status.innerHTML = '<span class="badge badge--ok">Active</span> ' +
                    'You get our plugins before public release.';
            } else {
                status.innerHTML = '<span class="badge">Pending</span> ' +
                    'Your request is under review. We will email you once it is active.';
            }
        }

        async function renderDownloads(profile) {
            const box = document.getElementById('downloads');
            try {
                const releases = await getReleases();
                if (!releases.length) {
                    box.innerHTML = profile && !profile.is_beta_tester
                        ? '<p class="account-empty">Downloads will appear here once your early access is active.</p>'
                        : '<p class="account-empty">No downloads available yet.</p>';
                    return;
                }

                box.innerHTML = releases.map((r) => `
                    <div class="download-row">
                        <div>
                            <strong>${escapeHtml(r.product)} ${escapeHtml(r.version)}</strong>
                            <span class="download-meta">
                                ${escapeHtml(r.platform)}${r.format ? ' &middot; ' + escapeHtml(r.format) : ''}
                                ${r.is_beta ? ' &middot; beta' : ''}
                            </span>
                        </div>
                        <button type="button" class="btn btn-primary"
                                data-path="${escapeHtml(r.storage_path)}">Download</button>
                    </div>
                `).join('');

                box.querySelectorAll('button[data-path]').forEach((btn) => {
                    btn.addEventListener('click', async () => {
                        btn.disabled = true;
                        const original = btn.textContent;
                        btn.textContent = 'Preparing...';
                        try {
                            const url = await getDownloadUrl(btn.dataset.path);
                            window.location.href = url;
                        } catch (err) {
                            show('Could not start the download: ' + err.message);
                        } finally {
                            btn.textContent = original;
                            btn.disabled = false;
                        }
                    });
                });
            } catch (err) {
                box.innerHTML = '<p class="account-empty">Could not load downloads.</p>';
            }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
    </script>
    <script src="script.js?v=5"></script>
</body>
</html>
